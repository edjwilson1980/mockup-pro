<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts for drawing customer SVG art on the server (Vercel has no system fonts).
  SVGs that ask for Arial / Helvetica / sans-serif get Arimo (same letter widths
  as Arial); Arial Black gets Arimo Bold (no open font matches
  its widths, and a wider one would run off the art). Loaded via FONTCONFIG_FILE in
  lib/server/fontconfig.ts. Licenses: OFL-*.txt.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/mockup-pro-fontconfig</cachedir>
  <alias binding="same"><family>Arial</family><prefer><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>Liberation Sans</family><prefer><family>Arimo</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Arimo</family></prefer></alias>
  <!-- Nothing open matches Arial Black's widths; Arimo's heaviest weight keeps text inside its box. -->
  <alias binding="same"><family>Arial Black</family><prefer><family>Arimo</family></prefer></alias>
</fontconfig>
